name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the auto-merge bot re-run CI on main after it merges a PR.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          check-latest: true

      # Pinned deliberately: a new linter release can add findings, so an
      # upgrade should be its own reviewed change, not an unrelated red build.
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          args: --timeout=5m

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          # Always the newest patch release: security fixes land there.
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The suite replays recorded fixtures and never reaches the network.
      - name: Test
        run: go test -race ./...

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Lint openapi.json
        run: npx --yes @redocly/cli@2.60.0 lint --extends=minimal internal/api/openapi.json
